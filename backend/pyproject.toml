[project]
name = "aristos-api"
version = "0.1.0"
description = "FastAPI backend for Aristos Engineering Knowledge Copilot"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.128,<1.0",
    "pydantic>=2.14,<3.0",
    "pydantic-settings>=2.16,<3.0",
    "qdrant-client>=1.20,<2.0",
    "uvicorn>=0.40,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3.0",
    "pytest>=9.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
